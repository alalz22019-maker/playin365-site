<style>
*{box-sizing:border-box}
body{margin:0;background:#e6e1d6;color:#151a2e;font-family:Cairo,sans-serif;-webkit-font-smoothing:antialiased;text-wrap:pretty}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:'Space Grotesk',sans-serif}
a{color:#4636e3;cursor:pointer}
.shell{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#faf8f3;box-shadow:0 0 46px rgba(21,26,46,.1)}
.hd{position:sticky;top:0;z-index:50;background:rgba(250,248,243,.94);backdrop-filter:blur(14px);border-bottom:1px solid #e3ded2;padding:13px 18px;display:flex;justify-content:space-between;align-items:center}
main{flex:1;padding:16px 18px 100px;display:flex;flex-direction:column;gap:12px;animation:popin .2s ease}
.card{background:#fff;border:1px solid #e9e4d8;border-radius:20px;padding:16px}
.stage{background:#151a2e;border-radius:22px;padding:18px;color:#faf8f3;position:relative;overflow:hidden}
.stage::before{content:"";position:absolute;inset-inline-start:62%;top:-70%;width:70%;height:230%;background:linear-gradient(200deg,#4636e3,#7b5cff);border-radius:50%;opacity:.5}
.stage>*{position:relative}
.btn{display:block;width:100%;background:#4636e3;color:#fff;border:0;border-radius:14px;padding:14px;font:900 12.5px Cairo;cursor:pointer;text-align:center}
.btn.gold{background:#f5c518;color:#151a2e}.btn.dark{background:#151a2e;color:#f5c518}
.btn.ghost{background:#fff;border:1px solid #e9e4d8;color:#565d78}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn,.card,.chip,.stat,.nav button{transition:border-color .18s ease,color .18s ease,box-shadow .18s ease,transform .18s ease}
.btn:active,.stat:active{transform:scale(.985)}
.btn.ghost:hover{border-color:#4636e3;color:#4636e3}
.fld input:focus,.fld select:focus{border-color:#4636e3;box-shadow:0 0 0 4px rgba(70,54,227,.12)}
.btn:not(.ghost){box-shadow:0 8px 18px rgba(70,54,227,.3)}
.btn.gold,.btn.dark{box-shadow:0 8px 18px rgba(21,26,46,.14)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 12px;font-size:10px;font-weight:900}
.chip.ok{background:#eaf5ee;color:#2c6e49}.chip.warn{background:#fff8df;border:1px solid #f0e2b4;color:#8a6912}
.chip.live{background:#fdeee8;color:#e8531f}.chip.bad{background:#fdeee8;color:#a83b25}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}
.fld label{font-size:11.5px;font-weight:800}
.fld input,.fld select{border:1px solid #e3ded2;border-radius:12px;padding:13px 14px;font:600 13px Cairo;outline:0;background:#fff;width:100%}
.fld input:focus{border-color:#4636e3;box-shadow:0 0 0 4px rgba(70,54,227,.12)}
.muted{font-size:10.5px;color:#8a8fa5;font-weight:700}
.h2{font-size:13px;font-weight:900;margin:0}
.lrow{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-top:1px solid #f0ece2}
.lrow:first-of-type{border-top:0;padding-top:0}
.ic{width:32px;height:32px;border-radius:50% 50% 50% 6px;background:#efedff;color:#4636e3;display:grid;place-items:center;font-size:13px;flex-shrink:0}
.nav{position:fixed;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;background:#fff;border-top:1px solid #e9e4d8;display:flex;justify-content:space-around;align-items:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:60}
.nav button{background:none;border:0;cursor:pointer;font:800 10.5px Cairo;color:#8a8fa5;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:#4636e3;font-weight:900}
.nav button i{font-style:normal;width:32px;height:32px;display:grid;place-items:center;font-size:15px;border-radius:12px}
.nav button.on i{background:#efedff}
.nav .fab{width:52px;height:52px;border-radius:50% 50% 50% 14px;background:#4636e3;color:#fff;font-size:22px;margin-top:-30px;box-shadow:0 10px 22px rgba(70,54,227,.35);display:grid;place-items:center}
.note{background:#fff8df;border:1px solid #f0e2b4;border-radius:16px;padding:13px;font-size:11px;color:#8a6912;font-weight:700;line-height:1.85}
.dnote{background:#151a2e;border-radius:16px;padding:13px;color:#c6cade;font-size:11px;font-weight:600;line-height:1.85}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#fff;border:1px solid #e9e4d8;border-radius:16px;padding:13px 10px;text-align:center}
.stat b{display:block;font:700 21px 'Space Grotesk';direction:ltr}
.toast{position:fixed;bottom:96px;inset-inline:0;margin:0 auto;width:fit-content;max-width:90%;background:#2c6e49;color:#fff;border-radius:13px;padding:12px 20px;font-size:12px;font-weight:900;z-index:90;box-shadow:0 14px 30px rgba(21,26,46,.25)}
.toast.err{background:#a83b25}
.wm{direction:ltr;unicode-bidi:isolate;font-family:'Space Grotesk';font-weight:700;letter-spacing:-1.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;height:9px;border-radius:99px;overflow:hidden;background:#f0ece2}
.skel{border-radius:14px;background:linear-gradient(90deg,#f2f0ea 25%,#fff 50%,#f2f0ea 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes popin{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:none}}
/* قرار المالك: اتجاه زاوية القطرة يرمز للدور — المدرب أسفل-يمين في كل عنصر بلا استثناء */
body.r-coach .ic{border-radius:50% 50% 6px 50%}
body.r-coach .nav .fab{border-radius:50% 50% 14px 50%}
body.r-coach #avx{border-radius:50% 50% 10px 50% !important}
@keyframes pls{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}</style>
