name: Import PlayIn academy parity

on:
  push:
    branches:
      - feat/academy-rekaz-parity-20261028

permissions:
  contents: write

concurrency:
  group: import-playin-academy-parity
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/academy-rekaz-parity-20261028
          fetch-depth: 0
          persist-credentials: true

      - name: Download verified patch bundle
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            https://sb-1k0rp8eic9ee.vercel.run/playin-academy-parity.patch.tar.gz \
            --output /tmp/playin-academy-parity.patch.tar.gz
          test "$(stat -c %s /tmp/playin-academy-parity.patch.tar.gz)" -eq 109096

      - name: Apply files and validate
        run: |
          tar -xzf /tmp/playin-academy-parity.patch.tar.gz -C .
          rm -f .github/workflows/import-playin-academy-parity.yml
          node --check app-academy-ops.js
          node --check app-academy-growth.js
          node --check app-academy-assistant.js
          node --check api/integrations/webhook.js
          node --check api/integrations/health.js
          python3 -m json.tool manifest.webmanifest >/dev/null
          python3 -m json.tool release.json >/dev/null
          git diff --check

      - name: Commit imported release candidate
        run: |
          git config user.name "playin365-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(academy): add Rekaz parity operations and experimental integrations"
          git push origin HEAD:feat/academy-rekaz-parity-20261028
