name: Import PlayIn pillars preview fixes

on:
  push:
    branches:
      - feat/pillars-identity-context-events-20261028
    paths:
      - .github/workflows/import-pillars-preview-fixes.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/pillars-identity-context-events-20261028
          fetch-depth: 0

      - name: Download and verify delta
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          curl --fail --silent --show-error --location \
            --retry 15 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            "https://sb-6btc3y7gbqna.vercel.run/pillars-preview-fixes.tar.gz?run=rc2" \
            --output pillars-preview-fixes.tar.gz
          curl --fail --silent --show-error --location \
            --retry 15 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 300 \
            "https://sb-6btc3y7gbqna.vercel.run/pillars-preview-fixes.sha256?run=rc2" \
            --output pillars-preview-fixes.sha256
          sha256sum --check --strict pillars-preview-fixes.sha256
          tar -tzf pillars-preview-fixes.tar.gz | sort > actual-files.txt
          cat > expected-files.txt <<'EOF'
          api/football-fixtures.js
          app-pillars.js
          docs/PILLARS-FOUNDATION-2026-10-28.md
          pillars.css
          release.json
          EOF
          sed -i 's/^          //' expected-files.txt
          diff -u expected-files.txt actual-files.txt

      - name: Import and validate
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/pillars-preview-fixes.tar.gz -C .
          rm -f .github/workflows/import-pillars-preview-fixes.yml
          node --check app-pillars.js
          node --check api/football-fixtures.js
          python3 -m json.tool release.json >/dev/null
          node -e "const r=require('./release.json'); if(r.version!=='2026.10.28-pillars-foundation-rc2'||r.quality_gates.personal_settings_multi_role!=='pass'||r.quality_gates.fixtures_graceful_fallback!=='pass') process.exit(1)"
          grep -F "T.settings=async function()" app-pillars.js >/dev/null
          grep -F "experimental_fallback" api/football-fixtures.js >/dev/null
          grep -F "M500 0 A500 500 0 0 1 1000 500 L1000 750 A250 250 0 0 1 750 1000 L500 1000 A500 500 0 0 1 500 0 Z" app-pillars.js >/dev/null

      - name: Unit test fixture fallback
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const handler=require('./api/football-fixtures.js');
          function response(){return {statusCode:0,headers:{},body:'',setHeader(k,v){this.headers[k.toLowerCase()]=v},end(v=''){this.body+=v}}}
          (async()=>{
            delete process.env.API_FOOTBALL_KEY;delete process.env.APISPORTS_KEY;delete process.env.API_SPORTS_KEY;
            const res=response();await handler({method:'GET',query:{date:'2026-10-28'}},res);const body=JSON.parse(res.body);
            if(res.statusCode!==200||body.ok!==true||body.configured!==false||body.source!=='experimental_fallback'||!Array.isArray(body.fixtures)||!Array.isArray(body.response))process.exit(1);
          })().catch(()=>process.exit(1));
          NODE

      - name: Commit imported fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PlayIn365 Release Bot"
          git config user.email "alalz22019@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pillars): restore role settings and fixture fallback" \
            -m "Adds personal settings for coach/player and a stable live-or-fallback football fixtures contract without removing academy settings."
          git push origin HEAD:feat/pillars-identity-context-events-20261028
