name: Import PlayIn pillars foundation

on:
  push:
    branches:
      - feat/pillars-identity-context-events-20261028
    paths:
      - .github/workflows/import-pillars-foundation.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/pillars-identity-context-events-20261028
          fetch-depth: 0

      - name: Download and verify signed bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://sb-6btc3y7gbqna.vercel.run/pillars-foundation-8245d1a.tar.gz" \
            --output /tmp/pillars-foundation.tar.gz
          echo "b4360cb916a004beadf4986a00dfa050f0a0f4379b217ce2deaf2d5f5eb648ab  /tmp/pillars-foundation.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/pillars-foundation.tar.gz

      - name: Import and validate
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/pillars-foundation.tar.gz -C .
          rm -f .github/workflows/import-pillars-foundation.yml
          for file in *.js api/*.js api/integrations/*.js; do
            [ -f "$file" ] && node --check "$file"
          done
          python3 -m json.tool release.json >/dev/null
          python3 -m json.tool manifest.webmanifest >/dev/null
          python3 -m json.tool docs/capability-registry.json >/dev/null
          grep -F "M500 0 A500 500 0 0 1 1000 500 L1000 750 A250 250 0 0 1 750 1000 L500 1000 A500 500 0 0 1 500 0 Z" app-pillars.js >/dev/null
          test "$(find supabase/migrations -maxdepth 1 -name '2026102814*.sql' | wc -l)" -eq 5

      - name: Commit imported release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PlayIn365 Release Bot"
          git config user.email "alalz22019@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(pillars): unify individuals organizations and events" \
            -m "Adds context-aware homes, independent identities, shared achievements, workflow routing, exact approved geometry, unified messaging, capability preservation, and hardened Supabase migrations."
          git push origin HEAD:feat/pillars-identity-context-events-20261028
