name: Import Three Pillars Foundation

on:
  push:
    branches:
      - feat/three-pillars-foundation-20261028
    paths:
      - .github/workflows/import-three-pillars-foundation.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/three-pillars-foundation-20261028
          fetch-depth: 0

      - name: Download validated archive chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/supabase.env
          import re
          text=open('config.js',encoding='utf-8').read()
          url=re.search(r'SUPABASE_URL:\s*["\x27]([^"\x27]+)',text).group(1)
          key=re.search(r'SUPABASE_ANON_KEY:\s*["\x27]([^"\x27]+)',text).group(1)
          print('SUPABASE_URL='+url)
          print('SUPABASE_ANON_KEY='+key)
          PY
          source /tmp/supabase.env
          curl -fsS --retry 5 --retry-delay 2 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_release_transfer_chunks" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --data '{"p_transfer_id":"0091dc09-ba42-46c6-93c1-3359e0033bd6","p_token":"0091dc09-ba42-46c6-93c1-3359e0033bd6"}' \
            -o /tmp/three-pillars-chunks.json
          python3 - <<'PY'
          import base64,hashlib,json
          rows=json.load(open('/tmp/three-pillars-chunks.json'))
          rows=sorted(rows,key=lambda x:x['seq'])
          assert len(rows)==6, f'expected 6 chunks, got {len(rows)}'
          assert [r['seq'] for r in rows]==list(range(6)), 'chunk sequence is incomplete'
          archive=b''
          for row in rows:
              part=base64.b64decode(row['payload_base64'])
              actual=hashlib.sha256(part).hexdigest()
              assert actual==row['chunk_sha256'], f"chunk {row['seq']} hash mismatch"
              archive+=part
          expected=rows[0]['archive_sha256']
          actual=hashlib.sha256(archive).hexdigest()
          assert actual==expected=='7d5d556a7a283a0666620f74d8479b3b9e83b950af1dcefe1b882b2d98abb1d9', 'archive hash mismatch'
          open('/tmp/three-pillars.tar.gz','wb').write(archive)
          print('archive verified',len(archive),actual)
          PY
          tar -tzf /tmp/three-pillars.tar.gz | grep -Ev '(^/|\.\./)' >/tmp/archive-paths.txt
          test "$(wc -l </tmp/archive-paths.txt)" -eq 10
          tar -xzf /tmp/three-pillars.tar.gz -C .

      - name: Validate imported foundation
        shell: bash
        run: |
          set -euo pipefail
          node --check app-pillars.js
          node --check sw.js
          python3 - <<'PY'
          import json
          release=json.load(open('release.json'))
          contract=json.load(open('three-pillars-contract.json'))
          assert release['version']=='2026.10.28-three-pillars-foundation-rc1'
          assert contract['qualityGates']['legacyRoutesPreserved'] is True
          PY
          grep -q 'app-pillars.js' index.html
          grep -q 'pillars.css' index.html
          grep -q 'my_three_pillars_home' app-pillars.js
          test -f supabase/migrations/20261028150000_three_pillars_foundation.sql
          test -f supabase/migrations/20261028150500_three_pillars_home_filter.sql
          test -f supabase/migrations/20261028151000_three_pillars_demo_completion.sql
          git diff --check

      - name: Commit imported release candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-three-pillars-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(platform): establish individuals organizations events foundation"
          git push origin HEAD:feat/three-pillars-foundation-20261028
