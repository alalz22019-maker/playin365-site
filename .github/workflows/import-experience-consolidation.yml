name: Import Experience Consolidation

on:
  push:
    branches:
      - feat/experience-consolidation-20261029

permissions:
  contents: write

concurrency:
  group: import-experience-consolidation
  cancel-in-progress: false

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[experience-import]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/experience-consolidation-20261029
          fetch-depth: 0

      - name: Download verified bundle
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://sb-2ttyibxb2nb0.vercel.run/transfer/experience-consolidation.tgz' \
            --output /tmp/experience-consolidation.tgz
          echo '1a9c76988112d826311d2d90e7ac0196a3cd4a514670685992cdd3b6a58124ea  /tmp/experience-consolidation.tgz' | sha256sum --check

      - name: Import and verify files
        run: |
          set -euo pipefail
          tar -xzf /tmp/experience-consolidation.tgz -C "$GITHUB_WORKSPACE"
          node --check app-experience.js
          node --check sw.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in [
              'release.json',
              'three-pillars-contract.json',
              'docs/capability-registry.json',
          ]:
              json.loads(Path(path).read_text())
          css = Path('experience.css').read_text()
          assert css.count('{') == css.count('}')
          assert 'app-experience.js' in Path('index.html').read_text()
          assert 'experience.css' in Path('index.html').read_text()
          print('bundle verification passed')
          PY

      - name: Commit imported implementation
        run: |
          set -euo pipefail
          git config user.name 'playin365-release-bot'
          git config user.email 'playin365-release-bot@users.noreply.github.com'
          git add \
            app-experience.js \
            experience.css \
            index.html \
            sw.js \
            release.json \
            three-pillars-contract.json \
            docs/capability-registry.json \
            docs/EXPERIENCE-CONSOLIDATION-2026-10-29.md
          if git diff --cached --quiet; then
            echo 'No import changes detected.'
            exit 0
          fi
          git commit -m 'feat(experience): import verified consolidation bundle [experience-import]'
          git push origin HEAD:feat/experience-consolidation-20261029
