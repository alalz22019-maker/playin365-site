name: Import Unified Three Pillars

on:
  push:
    branches:
      - feat/three-pillars-unified-20261028
    paths:
      - .github/workflows/import-three-pillars-unified.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/three-pillars-unified-20261028
          fetch-depth: 0

      - name: Download verified archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/supabase.env
          import re
          text=open('config.js',encoding='utf-8').read()
          print('SUPABASE_URL='+re.search(r'SUPABASE_URL:\s*["\x27]([^"\x27]+)',text).group(1))
          print('SUPABASE_ANON_KEY='+re.search(r'SUPABASE_ANON_KEY:\s*["\x27]([^"\x27]+)',text).group(1))
          PY
          source /tmp/supabase.env
          curl -fsS --retry 5 --retry-delay 2 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_release_transfer_chunks" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --data '{"p_transfer_id":"8f31b1d2-a690-4e57-83b2-3e3b931dbf14","p_token":"8f31b1d2-a690-4e57-83b2-3e3b931dbf14"}' \
            -o /tmp/unified-chunks.json
          python3 - <<'PY'
          import base64,hashlib,json
          rows=sorted(json.load(open('/tmp/unified-chunks.json')),key=lambda x:x['seq'])
          assert len(rows)==9
          assert [r['seq'] for r in rows]==list(range(9))
          archive=b''
          for row in rows:
              part=base64.b64decode(row['payload_base64'])
              assert hashlib.sha256(part).hexdigest()==row['chunk_sha256']
              archive+=part
          actual=hashlib.sha256(archive).hexdigest()
          assert actual==rows[0]['archive_sha256']=='ff252267b62947ba577707e3d288025a7decc30294e5c5e5f34c2fb2e50673f3'
          open('/tmp/unified.tar.gz','wb').write(archive)
          print('archive verified',len(archive),actual)
          PY
          tar -tzf /tmp/unified.tar.gz > /tmp/archive-paths.txt
          test "$(wc -l < /tmp/archive-paths.txt)" -eq 13
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/archive-paths.txt; then exit 1; fi
          tar -xzf /tmp/unified.tar.gz -C .

      - name: Validate release candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check app-pillars.js
          node --check sw.js
          python3 - <<'PY'
          import json,glob
          release=json.load(open('release.json'))
          contract=json.load(open('three-pillars-contract.json'))
          registry=json.load(open('docs/capability-registry.json'))
          assert release['version']=='2026.10.28-three-pillars-foundation-rc3'
          assert release['coverage']['total_role_route_checks']==91
          assert release['geometry']['redrawn'] is False
          assert registry['total_entries']==72
          assert set(['myHome','myIdentity']).issubset(contract['foundationRoutes'])
          assert sum(v['legacyRouteCount']+len(contract['foundationRoutes']) for v in contract['roles'].values())==91
          assert len(glob.glob('supabase/migrations/20261028140*.sql'))==5
          PY
          grep -q 'P.APPROVED_SHAPE_PATH' app-pillars.js
          if grep -q '<div class="p3-geometry' app-pillars.js; then exit 1; fi
          grep -q 'three-pillars-v2' index.html
          grep -q 'three-pillars-v2' sw.js
          git diff --check

      - name: Commit imported candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-three-pillars-unified.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(platform): unify three pillars UX governance and approved geometry"
          git push origin HEAD:feat/three-pillars-unified-20261028
