name: Import Golden Match Day

on:
  push:
    branches:
      - feat/golden-match-day-20261029

permissions:
  contents: write

jobs:
  import-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/golden-match-day-20261029
          fetch-depth: 0

      - name: Download and verify release
        run: |
          curl --fail --silent --show-error --location \
            https://qmpwekibhdzmpmdbuvxz.supabase.co/storage/v1/object/public/gmd-release-20261029/golden-match-day.tar.gz \
            --output /tmp/golden-match-day.tar.gz
          echo '9929536e5acf16368dd82048743ecb48021c0e17f1ca415cb98fc60aafe8eca9  /tmp/golden-match-day.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/golden-match-day.tar.gz -C .

      - name: Validate release files
        run: |
          node --check app-match-day.js
          node --check sw.js
          python3 - <<'PY'
          import json, os
          for path in ['release.json','three-pillars-contract.json','docs/capability-registry.json']:
              json.load(open(path))
          contract=json.load(open('three-pillars-contract.json'))
          registry=json.load(open('docs/capability-registry.json'))
          release=json.load(open('release.json'))
          checks=sum(v['legacyRouteCount']+len(contract['foundationRoutes']) for v in contract['roles'].values())
          assert checks == 97
          assert registry['total_entries'] == 74
          assert release['quality_gates']['cross_role_data_e2e'] == 'pass'
          assert os.path.getsize('supabase/migrations/20261029010000_golden_match_day_complete.sql') > 70000
          PY
          grep -q 'app-match-day.js' index.html
          grep -q 'match-day.css' index.html
          grep -q "T.matchDay" app-match-day.js
          git diff --check

      - name: Commit verified release
        run: |
          git config user.name 'PlayIn365 Release Bot'
          git config user.email 'alalz22019@gmail.com'
          git rm .github/workflows/import-golden-match-day.yml
          git add app-match-day.js match-day.css index.html sw.js release.json three-pillars-contract.json docs/capability-registry.json docs/GOLDEN-MATCH-DAY-2026-10-29.md supabase/migrations/20261029010000_golden_match_day_complete.sql
          git commit -m 'feat(match): deliver Golden Match Day across all three pillars'
          git push origin HEAD:feat/golden-match-day-20261029
