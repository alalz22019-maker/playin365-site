name: Import Golden Training Day

on:
  push:
    branches:
      - feat/golden-training-day-20261028

permissions:
  contents: write

jobs:
  import-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/golden-training-day-20261028
          fetch-depth: 0

      - name: Download and verify release
        run: |
          curl --fail --silent --show-error --location \
            https://sb-2ttyibxb2nb0.vercel.run/gtd-release-4b8c519f.tar.gz \
            --output /tmp/golden-training-day.tar.gz
          echo '4b8c519f7e0c2baf9564e7ccd002b7e67265c14f4f1ad9ea18bbeb175f32ccca  /tmp/golden-training-day.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/golden-training-day.tar.gz -C .

      - name: Validate release files
        run: |
          node --check app-training-day.js
          node --check sw.js
          python3 - <<'PY'
          import json
          for path in ['release.json','three-pillars-contract.json','docs/capability-registry.json']:
              json.load(open(path))
          contract=json.load(open('three-pillars-contract.json'))
          registry=json.load(open('docs/capability-registry.json'))
          checks=sum(v['legacyRouteCount']+len(contract['foundationRoutes']) for v in contract['roles'].values())
          assert checks == 94
          assert registry['total_entries'] == 73
          PY
          grep -q 'app-training-day.js' index.html
          grep -q 'training-day.css' index.html
          git diff --check

      - name: Commit verified release
        run: |
          git config user.name 'PlayIn365 Release Bot'
          git config user.email 'alalz22019@gmail.com'
          git rm .github/workflows/import-golden-training-day.yml
          git add app-training-day.js training-day.css index.html sw.js release.json three-pillars-contract.json docs/capability-registry.json docs/GOLDEN-TRAINING-DAY-2026-10-28.md supabase/migrations/20261028203000_golden_training_day_complete.sql
          git commit -m 'feat(training): deliver Golden Training Day across all three pillars'
          git push origin HEAD:feat/golden-training-day-20261028
